<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="940" height="470" fill="#ffffff"/>

  <text x="470" y="34" text-anchor="middle" font-size="21" font-weight="600" fill="#0f172a">From synthetic catchment to next-day discharge</text>
  <text x="470" y="56" text-anchor="middle" font-size="13" fill="#64748b">End-to-end pipeline of the LSTM flood-prediction experiment</text>

  <!-- Row 1 -->
  <rect x="30" y="90" width="200" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="130" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">generate_data.py</text>
  <text x="130" y="134" text-anchor="middle" font-size="11" fill="#166534">Synthetic hydrology</text>
  <text x="130" y="150" text-anchor="middle" font-size="11" fill="#166534">20 years, daily steps</text>
  <text x="130" y="166" text-anchor="middle" font-size="11" fill="#166534">Bucket rainfall-runoff model</text>
  <text x="130" y="186" text-anchor="middle" font-size="10" fill="#4d7c0f">seed 42, reproducible</text>

  <rect x="280" y="90" width="200" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="380" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">dataset.py</text>
  <text x="380" y="134" text-anchor="middle" font-size="11" fill="#166534">30-day sliding windows</text>
  <text x="380" y="150" text-anchor="middle" font-size="11" fill="#166534">3 features: rain, temp, soil</text>
  <text x="380" y="166" text-anchor="middle" font-size="11" fill="#166534">StandardScaler normalization</text>
  <text x="380" y="186" text-anchor="middle" font-size="10" fill="#4d7c0f">70 / 15 / 15 chronological split</text>

  <rect x="530" y="90" width="200" height="110" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="630" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#4c1d95">model.py — FloodLSTM</text>
  <text x="630" y="134" text-anchor="middle" font-size="11" fill="#5b21b6">2-layer LSTM encoder</text>
  <text x="630" y="150" text-anchor="middle" font-size="11" fill="#5b21b6">128 hidden units, dropout 0.2</text>
  <text x="630" y="166" text-anchor="middle" font-size="11" fill="#5b21b6">Last hidden state taken</text>
  <text x="630" y="186" text-anchor="middle" font-size="10" fill="#6d28d9">FC head: 128 &#8594; 64 &#8594; 1</text>

  <!-- Row 2 -->
  <rect x="530" y="250" width="200" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="630" y="274" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">train.py</text>
  <text x="630" y="294" text-anchor="middle" font-size="11" fill="#1d4ed8">Adam, lr 1e-3, weight decay</text>
  <text x="630" y="310" text-anchor="middle" font-size="11" fill="#1d4ed8">ReduceLROnPlateau</text>
  <text x="630" y="326" text-anchor="middle" font-size="11" fill="#1d4ed8">Early stopping, patience 15</text>
  <text x="630" y="346" text-anchor="middle" font-size="10" fill="#3b82f6">best epoch 12 &#183; 208,513 params</text>

  <rect x="280" y="250" width="200" height="110" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="380" y="274" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">evaluate.py</text>
  <text x="380" y="294" text-anchor="middle" font-size="11" fill="#9a3412">RMSE, MAE, R&#178;, NSE, PBIAS</text>
  <text x="380" y="310" text-anchor="middle" font-size="11" fill="#9a3412">Flood-event detection</text>
  <text x="380" y="326" text-anchor="middle" font-size="11" fill="#9a3412">95th-percentile threshold</text>
  <text x="380" y="346" text-anchor="middle" font-size="10" fill="#c2410c">1,065 test days</text>

  <rect x="30" y="250" width="200" height="110" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="130" y="274" text-anchor="middle" font-size="13" font-weight="600" fill="#831843">results/</text>
  <text x="130" y="294" text-anchor="middle" font-size="11" fill="#9d174d">best_model.pt + scalers</text>
  <text x="130" y="310" text-anchor="middle" font-size="11" fill="#9d174d">training_history.json</text>
  <text x="130" y="326" text-anchor="middle" font-size="11" fill="#9d174d">metrics JSON + 6 figures</text>
  <text x="130" y="346" text-anchor="middle" font-size="10" fill="#be185d">versioned for inspection</text>

  <!-- Arrows -->
  <line x1="232" y1="145" x2="276" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="482" y1="145" x2="526" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="202" x2="630" y2="246" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="528" y1="305" x2="484" y2="305" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="278" y1="305" x2="234" y2="305" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Metrics strip -->
  <rect x="30" y="392" width="880" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="426" font-size="12" font-weight="600" fill="#334155">Test set:</text>

  <rect x="140" y="404" width="118" height="32" rx="16" fill="#eff6ff"/>
  <text x="199" y="425" text-anchor="middle" font-size="12" fill="#1d4ed8">RMSE 2.551 m&#179;/s</text>

  <rect x="270" y="404" width="118" height="32" rx="16" fill="#eff6ff"/>
  <text x="329" y="425" text-anchor="middle" font-size="12" fill="#1d4ed8">MAE 1.833 m&#179;/s</text>

  <rect x="400" y="404" width="86" height="32" rx="16" fill="#f0fdf4"/>
  <text x="443" y="425" text-anchor="middle" font-size="12" fill="#15803d">R&#178; 0.899</text>

  <rect x="498" y="404" width="86" height="32" rx="16" fill="#f0fdf4"/>
  <text x="541" y="425" text-anchor="middle" font-size="12" fill="#15803d">NSE 0.899</text>

  <rect x="596" y="404" width="96" height="32" rx="16" fill="#fff7ed"/>
  <text x="644" y="425" text-anchor="middle" font-size="12" fill="#c2410c">PBIAS 3.6%</text>

  <rect x="704" y="404" width="176" height="32" rx="16" fill="#fdf2f8"/>
  <text x="792" y="425" text-anchor="middle" font-size="12" fill="#be185d">Flood F1 0.609 (95th pct)</text>
</svg>
