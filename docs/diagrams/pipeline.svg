<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" width="1080" height="610" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <rect width="1080" height="610" fill="#FFFFFF"/>
  <defs><style>
    .h { fill:#111827; font-size:19px; font-weight:600; }
    .s { fill:#4B5563; font-size:12.5px; }
    .lbl { fill:#111827; font-size:13px; font-weight:600; }
    .sub { fill:#4B5563; font-size:10.5px; }
    .cap { fill:#9CA3AF; font-size:11px; }
  </style></defs>
  <text class="h" x="30" y="36" text-anchor="start">From a synthetic catchment to a next-day forecast</text>
  <text class="s" x="30" y="58" text-anchor="start">Every box is code in this repository. The scores come from results/benchmark.json.</text>
  <rect x="30" y="84" width="235" height="104" rx="9" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.4"/>
  <text class="lbl" x="44" y="108">generate_data.py</text>
  <text class="sub" x="44" y="129" text-anchor="start">7,300 daily steps, seed 42</text>
  <text class="sub" x="44" y="145" text-anchor="start">rain, temperature, soil bucket</text>
  <text class="sub" x="44" y="161" text-anchor="start">seasonal terms 77% of variance</text>
  <text class="sub" x="44" y="177" text-anchor="start">rain-driven term 5.5%</text>
  <line x1="269" y1="136" x2="308.0" y2="136.0" stroke="#9CA3AF" stroke-width="1.6"/>
  <polygon points="316,136 308.0,140.4 308.0,131.6" fill="#9CA3AF"/>
  <rect x="320" y="84" width="235" height="104" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <text class="lbl" x="334" y="108">dataset.py</text>
  <text class="sub" x="334" y="129" text-anchor="start">30 day windows, 3 features</text>
  <text class="sub" x="334" y="145" text-anchor="start">target is the day after the window</text>
  <text class="sub" x="334" y="161" text-anchor="start">chronological 70 / 15 / 15 split</text>
  <text class="sub" x="334" y="177" text-anchor="start">scalers fitted on train only</text>
  <line x1="559" y1="136" x2="598.0" y2="136.0" stroke="#9CA3AF" stroke-width="1.6"/>
  <polygon points="606,136 598.0,140.4 598.0,131.6" fill="#9CA3AF"/>
  <rect x="610" y="84" width="235" height="104" rx="9" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.4"/>
  <text class="lbl" x="624" y="108">model.py and train.py</text>
  <text class="sub" x="624" y="129" text-anchor="start">2-layer LSTM, 128 hidden</text>
  <text class="sub" x="624" y="145" text-anchor="start">208,513 parameters</text>
  <text class="sub" x="624" y="161" text-anchor="start">early stopping, best epoch 41</text>
  <text class="sub" x="624" y="177" text-anchor="start">seed 42</text>
  <line x1="727" y1="192" x2="727.0" y2="228.0" stroke="#9CA3AF" stroke-width="1.6"/>
  <polygon points="727,236 722.6,228.0 731.4,228.0" fill="#9CA3AF"/>
  <rect x="610" y="240" width="235" height="104" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
  <text class="lbl" x="624" y="264">experiment.py</text>
  <text class="sub" x="624" y="285" text-anchor="start">scores 1,065 held-out days</text>
  <text class="sub" x="624" y="301" text-anchor="start">model and every baseline</text>
  <text class="sub" x="624" y="317" text-anchor="start">on exactly the same rows</text>
  <text class="sub" x="624" y="333" text-anchor="start">writes results/benchmark.json</text>
  <line x1="606" y1="292" x2="567.0" y2="292.0" stroke="#9CA3AF" stroke-width="1.6"/>
  <polygon points="559,292 567.0,287.6 567.0,296.4" fill="#9CA3AF"/>
  <rect x="320" y="240" width="235" height="104" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
  <text class="lbl" x="334" y="264">baselines.py</text>
  <text class="sub" x="334" y="285" text-anchor="start">train mean, the floor</text>
  <text class="sub" x="334" y="301" text-anchor="start">day-of-year mean, calendar only</text>
  <text class="sub" x="334" y="317" text-anchor="start">linear model on the same window</text>
  <text class="sub" x="334" y="333" text-anchor="start">persistence, for context</text>
  <line x1="316" y1="292" x2="277.0" y2="292.0" stroke="#9CA3AF" stroke-width="1.6"/>
  <polygon points="269,292 277.0,287.6 277.0,296.4" fill="#9CA3AF"/>
  <rect x="30" y="240" width="235" height="104" rx="9" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.4"/>
  <text class="lbl" x="44" y="264">scripts/figures</text>
  <text class="sub" x="44" y="285" text-anchor="start">five figures, all from the</text>
  <text class="sub" x="44" y="301" text-anchor="start">recorded run</text>
  <text class="sub" x="44" y="317" text-anchor="start">check_repository.py verifies</text>
  <text class="sub" x="44" y="333" text-anchor="start">the README still matches</text>
  <line x1="30" y1="382" x2="1050" y2="382" stroke="#E5E7EB"/>
  <text class="lbl" x="30" y="410" text-anchor="start">What the run found</text>
  <text class="cap" x="30" y="434" text-anchor="start">The LSTM reaches R2 0.921 on the held-out split. A lookup table of the mean discharge for each calendar day reaches 0.902</text>
  <text class="cap" x="30" y="452" text-anchor="start">on the same rows, using no weather input at all. Independent daily noise in the generator caps any forecaster at 0.969.</text>
  <text class="cap" x="30" y="478" text-anchor="start">The gap between the model and the calendar, 0.019, is the whole value the network adds. Most of the score is the seasonal cycle,</text>
  <text class="cap" x="30" y="496" text-anchor="start">which the table learns too.</text>
  <text class="s" x="30" y="532" text-anchor="start">Synthetic catchment. Not a real river, not a flood warning system, and not validated for any operational use.</text>
  <text class="cap" x="30" y="560" text-anchor="start">Generated by scripts/figures/generate_diagram.py.</text>
</svg>
