name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

      - name: Artifacts present and README agrees with the recorded run
        run: python scripts/check_repository.py

      - name: The generator is deterministic and the benchmark reproduces
        # Regenerates the data from seed 42 and re-scores the committed
        # checkpoint against every baseline. experiment.py overwrites
        # results/benchmark.json and exits 0 whatever it finds, so on its own it
        # proves nothing; check_reference_run.py is what compares the fresh
        # result against the committed one and fails on a difference.
        run: |
          python src/generate_data.py
          python src/experiment.py
          python scripts/check_reference_run.py

      - name: Figures regenerate
        run: python scripts/figures/generate_figures.py
